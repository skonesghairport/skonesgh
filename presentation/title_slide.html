<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F0F4F8; overflow: hidden; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #F0F4F8;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #2D3748;
        }
        .brand-logo {
            width: 120px;
            height: 80px;
            object-fit: contain;
            align-self: flex-start;
            margin-bottom: 24px;
        }
        .rule {
            width: 100%;
            height: 1px;
            background: #0A2540;
            margin-bottom: 20px;
        }
        .header {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 120px;
            color: #0A2540;
            line-height: 1;
            margin-bottom: 40px;
            text-align: left;
        }
        .subtitle {
            font-size: 40px;
            color: #E53E3E;
            font-weight: 400;
            margin-bottom: 60px;
            max-width: 800px;
            line-height: 1.2;
        }
        .footer-credit {
            font-size: 24px;
            font-weight: 400;
            color: #2D3748;
            margin-top: auto;
            border-left: 4px solid #E53E3E;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <img class="brand-logo" src="/home/ubuntu/skonesgh/presentation/assets/skones-security-logo.png" alt="Original Skones Security Limited logo">
        <div class="rule"></div>
        <h1 class="header">Skonesgh App</h1>
        <p class="subtitle">Security, Learning & Aviation Awareness</p>
        <div class="footer-credit">
            <strong>Skones Security</strong><br>
            A practical field guide for sharper security practice
        </div>
    </div>
</body>
</html>
