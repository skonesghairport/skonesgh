name: Push to GitHub (disabled)

# This workflow intentionally has no automatic trigger and no write-capable job.
# It replaces the former workflow that attempted to push with github-actions[bot]
# and failed with HTTP 403. Use reviewed pull requests or an approved deployment
# integration for repository changes instead of granting broad token permissions.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Disabled safely
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo 'The legacy Push to GitHub workflow is disabled.'
          echo 'Use a reviewed pull request or an approved deployment integration.'
